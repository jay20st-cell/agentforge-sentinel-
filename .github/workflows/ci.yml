name: Sentinel CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest
      - name: Static release preflight
        run: sentinel-preflight --static

  sharedos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sharedos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.11"
          cache: npm
          cache-dependency-path: sharedos/package.json
      - name: Install SharedOS bridge
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate bridge syntax
        run: node --check src/run-turn.mjs && node --check src/check-config.mjs
      - name: Validate web console JavaScript
        working-directory: .
        run: node -e 'const fs=require("fs"); const html=fs.readFileSync("web/index.html","utf8"); const match=html.match(/<script>([\s\S]*?)<\/script>/); if(!match) throw new Error("inline script missing"); new Function(match[1]); console.log("web console syntax ok");'
